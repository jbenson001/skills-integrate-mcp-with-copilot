<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="account-container">
        <h3>Student Account</h3>
        <div id="user-info" class="hidden">
          <p>Logged in as <strong><span id="user-email"></span></strong></p>
          <button id="logout-button" type="button">Logout</button>
        </div>

        <div id="auth-tabs" class="auth-tabs">
          <button id="show-login" type="button" class="active">Login</button>
          <button id="show-register" type="button">Register</button>
        </div>

        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required placeholder="Password" />
          </div>
          <button type="submit">Login</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <div class="form-group">
            <label for="register-name">Full Name:</label>
            <input type="text" id="register-name" required placeholder="Your full name" />
          </div>
          <div class="form-group">
            <label for="register-grade">Grade:</label>
            <input type="text" id="register-grade" required placeholder="10th Grade" />
          </div>
          <div class="form-group">
            <label for="register-email">Email:</label>
            <input type="email" id="register-email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="register-password">Password:</label>
            <input type="password" id="register-password" required placeholder="Password" />
          </div>
          <button type="submit">Register</button>
        </form>

        <form id="activate-form" class="auth-form hidden">
          <div class="form-group">
            <label for="activate-email">Registered Email:</label>
            <input type="email" id="activate-email" readonly />
          </div>
          <div class="form-group">
            <label for="activation-token">Activation Token:</label>
            <input type="text" id="activation-token" required placeholder="Paste the token here" />
          </div>
          <button type="submit">Activate Account</button>
        </form>

        <div id="auth-message" class="message hidden"></div>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="message hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
